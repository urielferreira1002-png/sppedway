name: Publish to Google Play

# Trigger on annotated tags like v1.2.3 and allow manual dispatch with a selectable track
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to publish to'
        required: false
        default: 'internal'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.speedway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Restore keystore from secret and create keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          if [ -z "$KEYSTORE_BASE64" ]; then echo "ERROR: KEYSTORE_BASE64 secret is empty"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/my-release-key.jks
          cat > android/keystore.properties <<EOF
storeFile=keystore/my-release-key.jks
storePassword=$KEYSTORE_PASSWORD
keyAlias=$KEY_ALIAS
keyPassword=$KEY_PASSWORD
EOF

      - name: Build Android AAB (bundleRelease)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Compute target Play track
        id: compute_track
        shell: bash
        run: |
          # If workflow_dispatch provided a 'track' input, use it
          if [ -n "${{ github.event.inputs.track }}" ]; then
            echo "track=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If triggered by a tag push, choose production for stable tags and internal for -rc pre-releases
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == *"-rc"* ]]; then
              echo "track=internal" >> "$GITHUB_OUTPUT"
            else
              echo "track=production" >> "$GITHUB_OUTPUT"
            fi
          else
            # Default to internal for manual or branch triggers
            echo "track=internal" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ steps.compute_track.outputs.track }}
